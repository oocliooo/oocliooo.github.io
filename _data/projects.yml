main:

  - title: "LumiNote: LLM-Assisted Multimodal Instruction for VR Stage Lighting Education"
    role: Project Leader
    collaboration: with <a href="https://wtong2017.github.io/">Prof. Wai Tong</a>, VVAI Lab, Texas A&amp;M University
    period: 2024 – Present
    description: An LLM-assisted Unity VR system that turns instructors' gestures and speech into live spatial annotations and 3D lighting scene actions.
